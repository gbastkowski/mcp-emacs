name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  byte-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Install dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\"))" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'web-server)" \
            --eval "(package-install 'websocket)"

      - name: Byte-compile
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -L elisp \
            -f batch-byte-compile \
            elisp/mcp-emacs.el elisp/mcp-emacs-server.el elisp/mcp-emacs-ide.el

      - name: Run tests
        run: |
          for t in test/mcp-emacs-apply-diff-test.el test/mcp-emacs-ide-test.el; do
            echo "== $t =="
            emacs --batch \
              --eval "(require 'package)" \
              --eval "(package-initialize)" \
              -L elisp -l "$t" 2>&1 | tee "/tmp/out.txt"
            grep -q FAIL "/tmp/out.txt" && { echo "TESTS FAILED in $t"; exit 1; } || true
          done
